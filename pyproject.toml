[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-federated-lora-aggregation"
version = "0.1.0"
description = "FedRPCA aggregation and parameter-only TN calibration research code"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["rspca", "experiments"]
package-dir = {rspca = "src/rspca", experiments = "experiments"}

[tool.pytest.ini_options]
testpaths = ["tests"]
